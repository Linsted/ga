name: My CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Одна версія для лінтера
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint # Можна зробити залежним від лінтера
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x] # Матриця тут
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run test

  e2e-test:
    runs-on: ubuntu-latest
    needs: test # Запускається тільки після успішних тестів
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Одна версія для E2E
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run test:e2e
